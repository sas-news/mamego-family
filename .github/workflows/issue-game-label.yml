name: issue-game-label

# issue タイトルの [slug] を読み取り、対応する `game:<slug>` ラベルを自動付与する。
# slug がゲーム一覧に存在する場合のみ付ける (誤爆防止)。
on:
  issues:
    types: [opened, edited, reopened]

permissions:
  issues: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: games.json

      - name: Apply game:slug label
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const title = context.payload.issue.title || '';
            const m = title.match(/^\[([^\]]+)\]/);
            if (!m) { console.log('no [slug] in title'); return; }
            const want = m[1].toLowerCase().replace(/\.html$/, '');
            const manifest = JSON.parse(fs.readFileSync('games.json', 'utf8'));
            const hit = manifest.games.find(g =>
              g.slug === want || g.slug === want + 'go' ||
              g.name.toLowerCase() === want || g.jp === m[1]);
            if (!hit) { console.log(`unknown slug: ${want}`); return; }
            const label = `game:${hit.slug}`;
            // ラベルが無ければ作る
            try {
              await github.rest.issues.getLabel({ ...context.repo, name: label });
            } catch (e) {
              await github.rest.issues.createLabel({
                ...context.repo, name: label, color: 'f59e0b',
                description: `${hit.name} (${hit.jp})`,
              });
            }
            await github.rest.issues.addLabels({
              ...context.repo, issue_number: context.payload.issue.number,
              labels: [label],
            });
            console.log(`labeled ${label}`);
