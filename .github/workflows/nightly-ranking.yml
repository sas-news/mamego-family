name: nightly-ranking

# 毎日 JST 05:00 (UTC 20:00) に GoatCounter のイベントを集計し ranking.js をコミットする。
# 必要な設定 (未設定なら何もせず終了):
#   Settings → Secrets and variables → Actions
#     Secret : GOATCOUNTER_TOKEN  (GoatCounter の API トークン)
#     Variable: GOATCOUNTER_CODE  (GoatCounter のサイトコード)
on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ranking:
    runs-on: ubuntu-latest
    env:
      # if: では secrets を直接参照できないため job env に移してから判定する
      GOATCOUNTER_CODE: ${{ vars.GOATCOUNTER_CODE }}
      GOATCOUNTER_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build ranking
        if: env.GOATCOUNTER_CODE != '' && env.GOATCOUNTER_TOKEN != ''
        run: node tools/build-ranking.js

      - name: Skip notice
        if: env.GOATCOUNTER_CODE == '' || env.GOATCOUNTER_TOKEN == ''
        run: echo "GOATCOUNTER_CODE / GOATCOUNTER_TOKEN 未設定のため集計スキップ (設定後に自動で動きます)"

      - name: Commit ranking.js
        if: env.GOATCOUNTER_CODE != '' && env.GOATCOUNTER_TOKEN != ''
        run: |
          if git diff --quiet docs/ranking.js docs/ranking.json 2>/dev/null; then
            echo "no change"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/ranking.js docs/ranking.json
            git commit -m "ranking: $(date -u +%Y-%m-%d) 集計"
            git push
          fi
